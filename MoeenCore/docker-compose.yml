services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: moeen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - moeen_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: moeen_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - moeen_redis_data:/data

volumes:
  moeen_postgres_data:
  moeen_redis_data:
